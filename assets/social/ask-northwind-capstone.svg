  <g filter="url(#shadow)" transform="translate(752 143)"><rect width="365" height="340" rx="26" fill="#1F3D33"/><path d="M30 0H335A30 30 0 0 1 365 30V70H0V30A30 30 0 0 1 30 0Z" fill="#173129"/><text x="29" y="43" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#F2EDE4">ASK NORTHWIND</text><circle cx="329" cy="35" r="7" fill="#D9642A"/><rect x="28" y="94" width="230" height="61" rx="15" fill="#F2EDE4"/><text x="47" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F3D33">Can I return a damaged tent?</text><text x="47" y="141" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#597169">I bought it last summer.</text><rect x="104" y="175" width="233" height="91" rx="15" fill="#5C9A86"/><text x="124" y="204" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFDF9">I’ll check the warranty terms</text><text x="124" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#EAF2EE">before I recommend next steps.</text><rect x="28" y="286" width="309" height="28" rx="14" fill="#294B40"/><circle cx="50" cy="300" r="5" fill="#D9642A"/><text x="65" y="305" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#DCE9E2">Uses scoped tools · waits for confirmation</text></g>
