<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Reliable AI principles social card</title><desc id="desc">A Northwind social card listing four practices that make AI features reliable.</desc>
  <rect width="1200" height="630" fill="#1F3D33"/>
  <circle cx="1125" cy="-8" r="310" fill="#5C9A86" opacity=".28"/><circle cx="1092" cy="24" r="198" fill="none" stroke="#F2EDE4" stroke-width="2" opacity=".28"/>
  <g transform="translate(72 64)"><rect width="58" height="58" rx="14" fill="#F2EDE4"/><path d="M38 23L53 43H27Z" fill="#5C9A86"/><path d="M24 14L41 43H7Z" fill="#1F3D33"/><path d="M24 14L29.5 23L26.5 22L24 25L21.5 21.7L18.5 23Z" fill="#F2EDE4"/><text x="77" y="36" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2.5" fill="#F2EDE4">CLAUDE TRIAGE API</text></g>
  <text x="72" y="202" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#D9642A" letter-spacing="3">THE COURSE IS NOT ABOUT A CHATBOT</text>
  <text x="72" y="276" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="800" fill="#F2EDE4">It’s about the controls</text>
  <text x="72" y="331" font-family="Arial, Helvetica, sans-serif" font-size="61" font-weight="800" fill="#F2EDE4">that make AI trustworthy.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(72 402)"><rect width="244" height="142" rx="18" fill="#294B40"/><text x="22" y="37" font-size="15" font-weight="700" fill="#D9642A" letter-spacing="1.8">01</text><text x="22" y="77" font-size="25" font-weight="700" fill="#F2EDE4">Output contracts</text><text x="22" y="108" font-size="17" fill="#B7CAC1">Shape what the model can say.</text></g>
    <g transform="translate(336 402)"><rect width="244" height="142" rx="18" fill="#294B40"/><text x="22" y="37" font-size="15" font-weight="700" fill="#D9642A" letter-spacing="1.8">02</text><text x="22" y="77" font-size="25" font-weight="700" fill="#F2EDE4">Tool boundaries</text><text x="22" y="108" font-size="17" fill="#B7CAC1">Ground decisions in real systems.</text></g>
    <g transform="translate(600 402)"><rect width="244" height="142" rx="18" fill="#294B40"/><text x="22" y="37" font-size="15" font-weight="700" fill="#D9642A" letter-spacing="1.8">03</text><text x="22" y="77" font-size="25" font-weight="700" fill="#F2EDE4">Cost visibility</text><text x="22" y="108" font-size="17" fill="#B7CAC1">Know what the feature costs.</text></g>
    <g transform="translate(864 402)"><rect width="264" height="142" rx="18" fill="#D9642A"/><text x="22" y="37" font-size="15" font-weight="700" fill="#F2EDE4" letter-spacing="1.8">04</text><text x="22" y="77" font-size="25" font-weight="700" fill="#FFFDF9">Evaluations</text><text x="22" y="108" font-size="17" fill="#FFF1E9">Measure failure before shipping.</text></g>
  </g>
</svg>
